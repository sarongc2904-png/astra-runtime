# ASTRA-NEXT-07 — persistence-ready Render Blueprint example
# IMPORTANT: example only. Do not apply until paid compute/disk is explicitly authorized.
# AnythingLLM stores SQLite, vector DB, uploads, agent flows, settings and related
# runtime state beneath STORAGE_DIR. The persistent disk must therefore mount at
# exactly /app/server/storage.

services:
  - type: web
    name: astra-next-anythingllm-persistent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: false

    # Minimum paid compute tier that can attach a persistent disk.
    # For production headroom, evaluate a larger plan separately.
    plan: 0.5c-512mb

    # Persistent single-instance storage for AnythingLLM runtime state.
    disk:
      name: astra-next-storage
      mountPath: /app/server/storage
      sizeGB: 1

    envVars:
      - key: PORT
        value: 3001
      - key: STORAGE_DIR
        value: /app/server/storage
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL_PREF
        value: openai/gpt-5-mini
      - key: EMBEDDING_ENGINE
        value: openrouter
      - key: EMBEDDING_MODEL_PREF
        value: baai/bge-m3
      - key: OPENROUTER_AGENT_MAX_TOKENS
        value: 4096
      - key: RUN_CAMPAIGN360_POC
        value: "false"
      - key: RUN_AGENT_FLOW_POC
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SIG_KEY
        sync: false
      - key: SIG_SALT
        sync: false
