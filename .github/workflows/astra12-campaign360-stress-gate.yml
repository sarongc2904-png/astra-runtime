name: ASTRA-12 Campaign360 Stress Gate

on:
  pull_request:
    paths:
      - 'astra/src/**'
      - 'astra/tests/astra12_campaign360_stress_gate.test.js'
      - 'astra/tests/astra12_icp_pains_participle_fidelity.test.js'
      - 'astra/tests/astra12_campaign360_structured_brief_facts.test.js'
      - 'astra/tests/astra12_final_synthesis_meta_guard.test.js'
      - 'astra/tests/astra12_ads_fidelity_normalizer.test.js'
      - 'astra/tests/astra12_market_context_problem_fidelity.test.js'
      - 'astra/tests/astra12_canonical_objective_leaf_fidelity.test.js'
      - '.github/workflows/astra12-campaign360-stress-gate.yml'
  push:
    branches:
      - astra-11-commercial-intelligence
    paths:
      - 'astra/src/**'
      - 'astra/tests/astra12_campaign360_stress_gate.test.js'
      - 'astra/tests/astra12_icp_pains_participle_fidelity.test.js'
      - 'astra/tests/astra12_campaign360_structured_brief_facts.test.js'
      - 'astra/tests/astra12_final_synthesis_meta_guard.test.js'
      - 'astra/tests/astra12_ads_fidelity_normalizer.test.js'
      - 'astra/tests/astra12_market_context_problem_fidelity.test.js'
      - 'astra/tests/astra12_canonical_objective_leaf_fidelity.test.js'
      - '.github/workflows/astra12-campaign360-stress-gate.yml'

jobs:
  stress-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run ICP pains fidelity regression
        run: node astra/tests/astra12_icp_pains_participle_fidelity.test.js
      - name: Run structured brief facts regression
        run: node astra/tests/astra12_campaign360_structured_brief_facts.test.js
      - name: Run final synthesis meta-guard regression
        run: node astra/tests/astra12_final_synthesis_meta_guard.test.js
      - name: Run Ads fidelity normalizer regression
        run: node astra/tests/astra12_ads_fidelity_normalizer.test.js
      - name: Run market-context problem fidelity regression
        run: node astra/tests/astra12_market_context_problem_fidelity.test.js
      - name: Run canonical objective leaf fidelity regression
        run: node astra/tests/astra12_canonical_objective_leaf_fidelity.test.js
      - name: Run 50-case Campaign360 offline stress gate
        run: node astra/tests/astra12_campaign360_stress_gate.test.js
